name: Update Google News Feed

on:
  schedule:
    - cron: '30 */4 * * *' # Roda a cada 4 horas (nos minutos 30)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Generate Google Feed
      run: python google_feed.py

    - name: Commit and Push
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git add google_world.xml
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update Google News" && git push)
