name: Update JW Feed

on:
  schedule:
    - cron: '0 */6 * * *' # Roda a cada 6 horas
  workflow_dispatch:      # Botão para rodar manual

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install -r requirements.txt

    # O COMANDO MÁGICO: Exatamente como funcionou no seu terminal
    - name: Download HTML with Curl (Minimalist)
      run: |
        curl --http1.1 "https://www.jw.org/en/whats-new/" -o jw_source.html

    - name: Generate RSS XML
      run: python scraper.py

    - name: Commit and Push
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git add feed.xml
        # Só faz commit se houver mudança para evitar erro
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update feed" && git push)
