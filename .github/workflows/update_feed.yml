name: Atualizar RSS JW.org

on:
  schedule:
    - cron: '0 */12 * * *' # Roda a cada 6 horas
  workflow_dispatch:      # Permite rodar manualmente clicando num botão

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Instalar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Rodar Scraper
      run: python scraper.py

    - name: Commit e Push das mudanças
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git add feed.xml
        # Só faz commit se houver mudança (para não dar erro)
        git diff --quiet && git diff --staged --quiet || (git commit -m "Atualizando feed RSS" && git push)
